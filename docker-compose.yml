services:
  catalog_db:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: "root"
      MONGO_INITDB_ROOT_PASSWORD: "pass"
      MONGO_INITDB_DATABASE: "catalog_db"
    ports:
      - "27017:27017"
    volumes:
      - "patient_catalog_data:/data/db"
    networks:
      - scoring-system
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 3

  redis_server:
    image: redis:alpine
    environment:
      REDIS_PASSWORD: pass
    ports:
      - "6379:6379"
    volumes:
      - "redis_data:/data"
    networks:
      - scoring-system

  api:
    build: ./api
    environment:
      MONGO_URL: "mongodb://root:pass@catalog_db:27017"
      REDIS_URL: "redis://redis_server:6379"
      C_FORCE_ROOT: "true"
    depends_on:
      catalog_db:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - scoring-system

  # celery worker with ml models simulation
  worker:
    build: ./worker
    environment:
      REDIS_URL: "redis://redis_server:6379"
      C_FORCE_ROOT: "true"
    networks:
      - scoring-system

  frontend:
    build: ./frontend
    ports:
      - "3001:3001"
    networks:
      - scoring-system

  proxy:
    image: nginx:alpine 
    ports:
      - "9123:9123"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    networks:
      - scoring-system
    depends_on:
      - api
      - frontend

volumes:
  patient_catalog_data:
  nginx.conf:
  redis_data:

networks:
  scoring-system:
