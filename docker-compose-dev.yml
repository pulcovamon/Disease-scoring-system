version: "3.8"

services:
  catalog_db:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: "root"
      MONGO_INITDB_ROOT_PASSWORD: "pass"
      MONGO_INITDB_DATABASE: "catalog_db"
    ports:
      - "27017:27017"
    volumes:
      - "patient_catalog_data:/data/db"
    networks:
      - scoring-system
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 3

  redis_server:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - "redis_data:/data"
    networks:
      - scoring-system

  api:
    build: ./api
    environment:
      MONGO_URL: "mongodb://root:pass@catalog_db:27017"
      REDIS_URL: "redis://redis_server:6379"
      C_FORCE_ROOT: "true"
      MODEL_STORAGE_PATH: "/models"
    depends_on:
      catalog_db:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - "model_storage:/models"
    networks:
      - scoring-system

  worker:
    build: ./worker
    environment:
      REDIS_URL: "redis://redis_server:6379"
      C_FORCE_ROOT: "true"
      MODEL_STORAGE_PATH: "/models"
    volumes:
      - "model_storage:/models"
    networks:
      - scoring-system

volumes:
  redis_data:
  patient_catalog_data:
  model_storage:

networks:
  scoring-system:
